<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>stuff.barts.space</title>
<style>
  :root{ --bg:#f6f7f9; --card:#fff; --ink:#1c2430; --muted:#6b7682; --line:#e6e9ee; --accent:#3b82f6; }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       color:var(--ink);background:var(--bg);-webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center;padding:24px}
  .wrap{max-width:640px;width:100%}
  h1{margin:0 0 4px;font-size:24px;letter-spacing:-.02em}
  .sub{margin:0 0 28px;color:var(--muted)}
  a.card{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);
         border-left:3px solid var(--accent);border-radius:12px;padding:18px 20px;margin-bottom:12px;
         box-shadow:0 1px 2px rgba(16,24,40,.05);transition:transform .08s ease,box-shadow .12s ease}
  a.card:hover{transform:translateY(-2px);box-shadow:0 6px 18px rgba(16,24,40,.10)}
  .card h2{margin:0 0 4px;font-size:17px}
  .card p{margin:0;color:var(--muted);font-size:13.5px}
  .card .path{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;color:var(--accent)}
  footer{margin-top:24px;color:var(--muted);font-size:12.5px}
</style>
</head>
<body>
<div class="wrap">
  <h1>stuff.barts.space</h1>
  <p class="sub">A little shelf of static things.</p>

  <a class="card" href="/knowledge-work-atlas/">
    <h2>Automatable Knowledge-Work Atlas</h2>
    <p>1,700+ small, automatable white-collar tasks — searchable and filterable by domain, role, and automation level.</p>
    <p class="path">/knowledge-work-atlas/</p>
  </a>

  <footer>More to come.</footer>
</div>
</body>
</html>
